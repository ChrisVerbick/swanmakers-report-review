[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Text", "Selection", "Range", "DomRect", "DomRectList", "EventSource", "MessageEvent", "Storage", "CssStyleDeclaration", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "NodeList", "Event", "MouseEvent", "Location", "History", "EventTarget", "CharacterData", "ScrollToOptions", "ScrollBehavior", "Crypto", "HtmlImageElement", "PointerEvent", "HtmlScriptElement", "HtmlHeadElement"] }

[lints]
workspace = true
