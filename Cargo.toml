[workspace]
resolver = "3"
members = ["server", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The browser client: smallest code wins over speed.
[profile.web]
inherits = "release"
opt-level = "z"
panic = "abort"
